services:

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    restart: on-failure
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: backend
    ports:
      - "4200:4200"
    env_file:
      - .env
    restart: on-failure
    depends_on:
      - postgres

volumes:
  postgres_data:
